
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinky Studios</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: white;
        }

        section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 100px 20px;
        }

        #home {
            background: radial-gradient(
                ellipse at center,
                #202020,
                #080808 70%
            );
        }

        #about {
            background: #101010;
            border-top: 1px solid #222;
        }

        h1 {
            font-size: clamp(70px, 15vw, 180px);
            font-weight: 900;
            letter-spacing: -6px;
            animation: fadeIn 1.5s ease;
        }

        .scroll {
            position: absolute;
            bottom: 35px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            animation: bounce 2s infinite;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #666;
            border-top: 1px solid #222;
            font-size: 13px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(8px);
            }
        }

        @media (max-width: 500px) {
            nav {
                padding: 20px;
            }

            .logo {
                font-size: 19px;
            }

            nav a {
                margin-left: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Tinky Studios</div>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </div>
    </nav>

    <section id="home">
        <h1>Tinky</h1>

        <a class="scroll" href="#about">
            SCROLL ↓
        </a>
    </section>

    <section id="about">
        <h1>Tinky</h1>
    </section>

    <footer>
        © 2026 Tinky Studios
    </footer>

</body>
</html>
